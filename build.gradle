plugins {
    id 'java'
    id 'war'
    id 'org.springframework.boot' version '3.4.0'
    id 'io.spring.dependency-management' version '1.1.6'
    id 'application'
}

group = 'ru.tele2.govorova.java.basic.http.server'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    compileOnly 'org.projectlombok:lombok:1.18.28'
    annotationProcessor 'org.projectlombok:lombok:1.18.28'
    implementation group: 'org.postgresql', name: 'postgresql', version: '42.7.4'
    implementation 'jakarta.servlet:jakarta.servlet-api:6.0.0'
    implementation 'org.apache.logging.log4j:log4j-slf4j-impl:2.17.1'
    implementation 'org.apache.logging.log4j:log4j-core:2.17.1'
    implementation 'org.springframework.boot:spring-boot-starter'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

war {
    archiveFileName = 'calculator.war'
}

tasks.register('deployWar', Copy) {
    dependsOn(tasks.named('war'))
    from(tasks.named('war').map { it.outputs.files.singleFile })
    into('C:\\Downloads\\apache-tomcat-11.0.1\\webapps')
}

test {
    useJUnitPlatform()
}

application {
    mainClass = 'ru.tele2.govorova.otus.java.pro.spring_context.Application'
}
